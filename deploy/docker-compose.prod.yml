# Full-stack deployment: MySQL + observability + backend + frontend.
#
# Bring it up with:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# or, on a fresh host, with deploy/bootstrap.sh which does the whole thing.
#
# Exposure: ONLY the frontend publishes a port (80). MySQL and the observability stack are bound to
# 127.0.0.1 so they are reachable over an SSH tunnel but not from the internet.
#
# Secrets and image references come from deploy/.env (git-ignored). The `${VAR:?message}` form makes
# compose fail fast instead of silently starting with an empty password.
#
# Image references are variables because registry-1.docker.io is blocked on some networks (mainland
# China); deploy/.env.example points them at Huawei Cloud SWR mirrors. The defaults below are the
# plain Docker Hub references, so the file still works unchanged elsewhere.

name: text2sql

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: ${APP_DB_NAME:-text2sql}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # Localhost only: `ssh -L 3306:127.0.0.1:3306 <user>@<host>` when you need a client.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Schema and seed data. These init scripts run only on an empty data directory; on a
      # preemptible instance that is exactly what happens on every fresh boot.
      - ../text2sql-backend/src/main/resources/db/app-schema.sql:/docker-entrypoint-initdb.d/01-app-schema.sql:ro
      - ../text2sql-backend/src/main/resources/db/app-data.sql:/docker-entrypoint-initdb.d/02-app-data.sql:ro
    healthcheck:
      # $$ escapes to a literal $ inside the container, where MYSQL_ROOT_PASSWORD is already set,
      # so the password is not duplicated into the compose file's environment.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  otel-lgtm:
    image: ${OTEL_IMAGE:-grafana/otel-lgtm:0.22.0}
    restart: unless-stopped
    ports:
      # Localhost only: `ssh -L 3000:127.0.0.1:3000 <user>@<host>` then open http://localhost:3000
      - "127.0.0.1:3000:3000"   # Grafana
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:9090:9090"   # Prometheus

  # Vector database for the three knowledge collections (metadata / business / agent).
  pgvector:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KNOWLEDGE_PGVECTOR_PASSWORD:?set KNOWLEDGE_PGVECTOR_PASSWORD in deploy/.env}
      POSTGRES_DB: ${KNOWLEDGE_PGVECTOR_DB:-text2sql}
    ports:
      # Localhost only: `ssh -L 5433:127.0.0.1:5433 <user>@<host>` for a SQL client.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      # Applied on an empty data directory; the backend also runs the same DDL (idempotently) on
      # startup, so an already-initialised volume still gets new tables/indexes.
      - ../text2sql-backend/src/main/resources/db/knowledge-schema.sql:/docker-entrypoint-initdb.d/01-knowledge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Private object storage for knowledge originals, parse artifacts and URL snapshots.
  # Port 9000 is published because presigned download URLs are opened by the browser, and the
  # signature covers the host — it must be the same address the browser uses. The bucket itself is
  # private: only short-lived presigned GET URLs work.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-07-23T15-54-02Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"             # S3 API used by presigned preview URLs
      - "127.0.0.1:9001:9001"   # web console, localhost only (SSH tunnel)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ../text2sql-backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.16-eclipse-temurin-25-noble}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:25-jre-alpine}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # NOTE: do NOT append sslMode=DISABLED. MySQL 8.4 authenticates the root user with
      # caching_sha2_password, and r2dbc-mysql (default sslMode=PREFERRED) needs the encrypted
      # connection to complete that handshake.
      APP_DB_R2DBC_URL: r2dbc:mysql://mysql:3306/${APP_DB_NAME:-text2sql}
      APP_DB_USERNAME: root
      APP_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      TEXT2SQL_JWT_SECRET: ${TEXT2SQL_JWT_SECRET:?set TEXT2SQL_JWT_SECRET in deploy/.env}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # The campus demo target database: same MySQL server, its own schema, created on first connect.
      CAMPUS_DB_JDBC_URL: "jdbc:mysql://mysql:3306/campus?createDatabaseIfNotExist=true&sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      CAMPUS_DB_USERNAME: root
      CAMPUS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-lgtm:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-lgtm:4318/v1/metrics
      # --- Persistent three-type knowledge base ---
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-true}
      KNOWLEDGE_PGVECTOR_URL: jdbc:postgresql://pgvector:5432/${KNOWLEDGE_PGVECTOR_DB:-text2sql}
      KNOWLEDGE_PGVECTOR_USERNAME: postgres
      KNOWLEDGE_PGVECTOR_PASSWORD: ${KNOWLEDGE_PGVECTOR_PASSWORD:?set KNOWLEDGE_PGVECTOR_PASSWORD in deploy/.env}
      KNOWLEDGE_MINIO_ENDPOINT: http://minio:9000
      # Public address the browser uses for presigned preview URLs (e.g. http://1.2.3.4:9000).
      KNOWLEDGE_MINIO_PUBLIC_ENDPOINT: ${KNOWLEDGE_MINIO_PUBLIC_ENDPOINT:-}
      KNOWLEDGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      KNOWLEDGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
      # PDF/image layout parsing (page + bbox). Empty means PDF/image imports fail with a clear reason.
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      # Semantic retrieval needs an embedding model; without it the knowledge base uses lexical recall.
      TEXT2SQL_RAG_ENABLED: ${TEXT2SQL_RAG_ENABLED:-false}
    expose:
      - "8080"

  frontend:
    build:
      context: ../text2sql-frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
  pgvector-data:
  minio-data:
