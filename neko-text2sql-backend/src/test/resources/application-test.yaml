# Test profile: replaces the MySQL application database with in-memory H2 (MODE=MySQL) over R2DBC, so
# the suite runs without an external server. Activated for all tests via the maven-surefire `test`
# profile.
spring:
  r2dbc:
    url: "r2dbc:h2:mem:///appdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE"
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/app-schema.sql
      data-locations: classpath:db/test-access-data.sql

# The demo *target* datasource stays on in-memory H2 here. application.yml points it at MySQL, but
# the suite must run without an external server, and a later `text2sql.datasources.items` list
# replaces the earlier one wholesale.
text2sql:
  datasources:
    default-id: campus
    items:
      - id: campus
        name: 智慧校园（H2）
        driver: org.h2.Driver
        url: "jdbc:h2:mem:campus;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE"
        username: sa
        password: ""
        dialect: H2
        seed: true
      # A second datasource with a dash in its id: it lets tests exercise multi-datasource ordering
      # and the datasource id space (ids are only ever bound, never interpolated). It is seeded with
      # the same demo schema so metadata validation has real tables to check.
      - id: erp-prod
        name: ERP（H2）
        driver: org.h2.Driver
        url: "jdbc:h2:mem:erp;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE"
        username: sa
        password: ""
        dialect: H2
        seed: true
