# Local all-in-one stack for the neko-text2sql.
#
#   Grafana UI : http://localhost:3000   (anonymous admin access, no login)
#   OTLP HTTP  : http://localhost:4318   (v1/traces, v1/metrics -> matches application.yaml)
#   OTLP gRPC  : localhost:4317
#   Prometheus : http://localhost:9090   (exposed for debugging)
#
#   MySQL      : localhost:3306          (root / root, database `text2sql`)
#   pgvector   : localhost:5433          (postgres / postgres, database `text2sql`)
#   MinIO API  : http://localhost:9000   (minioadmin / minioadmin)
#   MinIO UI   : http://localhost:9001
#
# Images default to the Huawei Cloud SWR mirror for mainland-China networks. Override the prefix to
# pull from Docker Hub instead:
#   $env:REGISTRY_PREFIX = ""            # PowerShell (empty prefix -> official images)
#   REGISTRY_PREFIX= docker compose up -d # bash
#
# Start:  docker compose up -d
# Stop:   docker compose down
services:
  otel-lgtm:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/grafana/otel-lgtm:latest"
    container_name: text2sql-otel-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9090:9090"   # Prometheus (debugging)
    restart: unless-stopped

  mysql:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/mysql:8.4"
    container_name: text2sql-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: text2sql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - text2sql-mysql-data:/var/lib/mysql
      # The application schema (users / model_config / conversation / message) and the seed data
      # (admin + student01/02/03 + counselor01 with their scopes and conversations) are provisioned
      # here, so the MySQL database is fully defined by docker-compose. Init scripts only run on an
      # empty data directory; to re-seed, `docker compose down -v` first.
      - ./neko-text2sql-backend/src/main/resources/db/app-schema.sql:/docker-entrypoint-initdb.d/01-app-schema.sql:ro
      - ./neko-text2sql-backend/src/main/resources/db/app-data.sql:/docker-entrypoint-initdb.d/02-app-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Vector database for the three knowledge collections. Its data directory is independent of MySQL,
  # and the schema (with the `vector` extension and the HNSW index) is applied on first start.
  pgvector:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/pgvector/pgvector:pg16"
    container_name: text2sql-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: text2sql
    ports:
      - "5433:5432"
    volumes:
      - text2sql-pgvector-data:/var/lib/postgresql/data
      - ./neko-text2sql-backend/src/main/resources/db/knowledge-schema.sql:/docker-entrypoint-initdb.d/01-knowledge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d text2sql"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Private object storage for knowledge originals, parse artifacts and URL snapshots.
  minio:
    image: "${REGISTRY_PREFIX:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io}/minio/minio:RELEASE.2025-07-23T15-54-02Z"
    container_name: text2sql-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # S3 API (presigned preview URLs target this)
      - "9001:9001"   # web console
    volumes:
      - text2sql-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  text2sql-mysql-data:
  text2sql-pgvector-data:
  text2sql-minio-data:
